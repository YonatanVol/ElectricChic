name: Chore
description: Tooling, infrastructure, dependencies, refactoring.
labels: ['type:chore']
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations: { required: true }

  - type: textarea
    id: why
    attributes:
      label: Why now
      description: What does this unblock, or what risk does it reduce?
    validations: { required: true }

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will you know it worked? Prefer something you can demonstrate.
    validations: { required: true }

  - type: textarea
    id: rollback
    attributes:
      label: Rollback

  - type: dropdown
    id: effort
    attributes:
      label: Relative effort
      options: ['S', 'M', 'L', 'XL']
    validations: { required: true }
