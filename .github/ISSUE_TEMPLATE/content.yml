name: Content
description: Copy, product data, legal text, documentation.
labels: ['type:content']
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind of content
      options:
        - Marketing copy
        - Product data
        - Legal text (needs professional review)
        - Operations documentation
        - Developer documentation
    validations: { required: true }

  - type: textarea
    id: what
    attributes:
      label: What is needed
    validations: { required: true }

  - type: input
    id: owner
    attributes:
      label: Who supplies it
      description: Client, developer, lawyer, accountant, accessibility consultant.
    validations: { required: true }

  - type: checkboxes
    id: review
    attributes:
      label: Professional review required
      description: Legal, tax, accounting, privacy and accessibility text is not drafted by the developer.
      options:
        - label: Lawyer
        - label: Accountant
        - label: Accessibility consultant
        - label: None — ordinary content

  - type: input
    id: deadline
    attributes:
      label: Needed by
      description: Which delivery step does this block?
